[project]
name = "postradio"
dynamic = ["version"]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["troi>=2026.9", "requests", "pyyaml"]


[project.optional-dependencies]
server = ["fastapi", "uvicorn"]
dev = ["pytest", "ruff", "fastapi", "httpx"]

[project.scripts]
postradio = "postradio.cli:run"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.setuptools.dynamic]
version = { attr = "postradio.brand.VERSION" }  # single source: postradio/brand.py

[tool.setuptools.packages.find]
include = ["postradio*"]

[tool.setuptools.package-data]
postradio = ["data/*.json", "data/*.md", "data/*.txt"]
