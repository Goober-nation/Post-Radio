[project]
name = "pvrecs"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["troi>=2026.9", "requests", "pyyaml"]


[project.optional-dependencies]
server = ["fastapi", "uvicorn"]
dev = ["pytest", "ruff", "fastapi", "httpx"]

[project.scripts]
pvrecs = "pvrecs.cli:run"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
